# Mac-compatible environment (Apple Silicon / CPU/MPS)
# To run: conda env create -f environment-mac.yml
name: metcnn_mac
channels:
    - conda-forge
    - pytorch
dependencies:
    - python=3.9  # 3.7 is EOL, 3.9 is closest that works on arm64
    - pip
    # No cudatoolkit - using CPU/MPS instead
    - numpy=1.21.0  # Closest compatible version for arm64
    - matplotlib=3.5.0
    - numba=0.55.1
    - pyyaml=6.0
    - scikit-image=0.19.0
    - tqdm=4.55.0
    - pip:
        - torch>=1.10.0  # Will install arm64-native version
        - lazy-import==0.2.2
        - SimpleITK==2.2.1
        - itk==5.4.0

